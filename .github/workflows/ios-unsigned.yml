name: Build unsigned iOS app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned Runner.app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run configuration checks
        run: bash test/ci_config_test.sh && bash test/feature_config_test.sh

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify unsigned app bundle
        run: |
          test -d build/ios/iphoneos/Runner.app
          if codesign --verify build/ios/iphoneos/Runner.app 2>/dev/null; then
            echo "Runner.app is unexpectedly signed" >&2
            exit 1
          fi

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Selene-iOS-unsigned.app.zip

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Selene-iOS-unsigned-app
          path: build/ios/Selene-iOS-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
